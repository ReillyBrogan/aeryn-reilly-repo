name        : eden
version     : "0.2.1"
release     : 2
upstreams   :
    - git|https://git.eden-emu.dev/eden-emu/eden.git : b4e39d9ae412eebcc896759eedd58226d43a43c5 # v0.2.1
    # Upstream's clang PGO profile, regenerated every few months at https://github.com/Eden-CI/PGO
    - https://github.com/Eden-CI/PGO/releases/download/v020525/eden.profdata:
        hash: 777dd9aefb9427ed08a642b02998f32c5ac120e5d32611d8f21cf1f4e68cee57
        unpack: false
        rename: eden-v020525.profdata
summary     : Eden Nintendo Switch Emulator
description : |
    A free and open source Switch 1 emulator derived from Yuzu and Sudachi.
license     : GPL-3.0-or-later
homepage    : https://eden-emu.dev/
# CPM fetches the externals aerynOS does not package (enet, cubeb, quazip, sirit, ...)
networking  : true
builddeps   :
    - binary(glslangValidator)
    - binary(patch)
    - cmake(Boost)
    - cmake(LLVM)
    - cmake(Qt6Charts)
    - cmake(Qt6Core)
    - cmake(Qt6DBus)
    - cmake(Qt6GuiPrivate)
    - cmake(Qt6Widgets)
    - cmake(SDL3)
    - cmake(SPIRV-Tools)
    - cmake(VulkanHeaders)
    - cmake(VulkanUtilityLibraries)
    - pkgconfig(alsa)
    - pkgconfig(fmt)
    - pkgconfig(gamemode)
    - pkgconfig(jack)
    - pkgconfig(libavcodec)
    - pkgconfig(libavfilter)
    - pkgconfig(libavutil)
    - pkgconfig(liblz4)
    - pkgconfig(libpulse)
    - pkgconfig(libswscale)
    - pkgconfig(libusb-1.0)
    - pkgconfig(libzstd)
    - pkgconfig(nlohmann_json)
    - pkgconfig(openssl)
    - pkgconfig(opus)
    - pkgconfig(x11)
    - pkgconfig(zlib)
rundeps     :
    - qt6-wayland
    # gamemode_client.h dlopens this at runtime
    - soname(libgamemode.so.0(x86_64))
environment : |
    # Same PGO flags as upstream's own builds (Eden-CI/Workflow .ci/build/targets.sh); the
    # profile path is versioned so a profile bump also busts any ccache entry
    pgo_flags="-fprofile-use=%(sourcedir)/eden-v020525.profdata -Wno-backend-plugin -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
    export CFLAGS+=" ${pgo_flags}"
    export CXXFLAGS+=" ${pgo_flags}"
setup       : |
    # boulder's shallow clone cannot git describe, so pin the build version
    printf 'v%(version)' > GIT-TAG
    printf 'v%(version)' > GIT-RELEASE

    %patch %(pkgdir)/0001-common-add-missing-cstring-include.patch
    # %patch %(pkgdir)/0002-externals-patch-httplib-for-openssl-4.patch
    # %patch %(pkgdir)/0003-common-include-fmt-format.patch

    %cmake \
        -DDYNARMIC_USE_LLVM=ON \
        -DENABLE_UPDATE_CHECKER=OFF \
        -DENABLE_WEB_SERVICE=OFF \
        -DTITLE_BAR_FORMAT_IDLE="eden %(version) {}" \
        -DTITLE_BAR_FORMAT_RUNNING="eden | %(version) {}" \
        -DYUZU_TESTS=OFF
build       : |
    %cmake_build
install     : |
    %cmake_install
# dynarmic/xbyak are ODR-sensitive, LTO corrupts the JIT backend
tuning      :
    - lto: false
