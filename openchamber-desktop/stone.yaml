name        : openchamber-desktop
version     : "2.7.3"
release     : 11
summary     : OpenChamber desktop client
license     : MIT
homepage    : https://openchamber.dev
upstreams   :
    - https://github.com/openchamber/openchamber/archive/refs/tags/v2.7.3.tar.gz : 830ff3866a8733ff13a5a2565fa78d967c3eab317f661146021ffa70ae68e156
description : |
    OpenChamber is a workspace for running, supervising and reviewing AI coding
    work, built on the OpenCode coding agent. It runs as a desktop app, in a
    browser, in an editor or on a phone.
networking  : true
builddeps   :
    - binary(g++)
    - binary(gcc)
    - binary(gzip)
    - binary(make)
    - binary(nm)
    - binary(node)
    - binary(npm)
    - binary(python3)
    - binary(rg)
    - binary(tar)
rundeps     :
    - binary(rg)
    - libayatana-appindicator
    - libnotify
    - opencode
    - soname(libXss.so.1(x86_64))
    - soname(libXtst.so.6(x86_64))
environment : |
    # Bun is not packaged, so provision it from npm into the build tree and put
    # it on PATH for the root postinstall and the build scripts.
    BUN_VERSION=$(node -p "require('%(workdir)/package.json').packageManager.replace('bun@', '')")
    PATH="%(workdir)/.bun/node_modules/.bin:${PATH}"
setup       : |
    npm install --prefix %(workdir)/.bun "bun@${BUN_VERSION}"

    # postinstall builds the SDK and built-in extensions, and fetches Electron
    bun install --frozen-lockfile
build       : |
    cd packages/electron

    bun run build:web-assets
    bun run prepare:opencode-server
    bun run bundle:main
    bun run rebuild:native

    # Upstream's packaging check wants the resource present; point it at the
    # system binary, which is what the installed package uses.
    mkdir -p resources/ripgrep
    ln -sf /usr/bin/rg resources/ripgrep/rg

    # Unpacked tree; no need to build (or run) an AppImage just to repackage it
    node ./scripts/package.mjs --linux --x64 --dir
install     : |
    openchamberdir=%(libdir)/%(name)

    %install_dir %(installroot)$openchamberdir
    cp -a packages/electron/dist/linux-unpacked/. %(installroot)$openchamberdir

    # The bundled self updater cannot work from a packaged install
    rm -f %(installroot)$openchamberdir/resources/app-update.yml

    # Use the packaged OpenCode CLI instead of the bundled ~9 MB server copy.
    # Without it the app falls back to `opencode` on PATH, which is what the
    # installed package uses.
    rm -rf %(installroot)$openchamberdir/resources/opencode-server

    # Use the system ripgrep instead of a bundled copy
    %install_dir %(installroot)$openchamberdir/resources/ripgrep
    ln -sf /usr/bin/rg %(installroot)$openchamberdir/resources/ripgrep/rg

    %install_dir %(installroot)%(bindir)
    ln -srv %(installroot)$openchamberdir/openchamber %(installroot)%(bindir)/openchamber

    %install_dir %(installroot)%(datadir)/icons/hicolor/scalable/apps
    %install_file %(pkgdir)/openchamber.svg %(installroot)%(datadir)/icons/hicolor/scalable/apps/openchamber.svg
    %install_file %(pkgdir)/openchamber.desktop -t %(installroot)%(datadir)/applications

    # Fix permissions
    find %(installroot) -type d -exec chmod 755 {} +
