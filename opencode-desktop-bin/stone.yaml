name        : opencode-desktop-bin
version     : "2.0.26"
release     : 1
summary     : OpenCode desktop client
license     : MIT
homepage    : https://opencode.ai
upstreams   :
    - https://opencode.ai/files/bin/2.0.26/opencode-desktop-linux-amd64.deb:
        hash: ca87394bb997e675adf6e927191c802ad0562ec15b57413aa73fb3be5dbf48ce
        unpack: false
        rename: opencode-desktop.deb
description : |
    OpenCode is an open source AI coding agent that helps you write and run code with any AI model.
builddeps   :
    - binary(bsdtar-static)
rundeps     :
    - binary(rg)
    - binary(xdg-open)
    - libnotify
# Electron and the bundled Bun based opencode CLI must not be stripped or debug-split
debug       : false
strip       : false
install     : |
    %install_dir %(installroot)
    bsdtar-static -O -xf %(sourcedir)/opencode-desktop.deb data.tar.xz | bsdtar-static -C "%(installroot)" -xJf -

    # The Debian package installs under /opt; relocate into /usr/lib
    %install_dir %(installroot)%(libdir)/opencode-desktop
    cp -a %(installroot)/opt/OpenCode/. %(installroot)%(libdir)/opencode-desktop/
    rm -rf %(installroot)/opt

    # Prune Debian specific files and the built in updater
    rm -rf %(installroot)/usr/share/doc
    rm -f %(installroot)%(libdir)/opencode-desktop/resources/apparmor-profile
    rm -f %(installroot)%(libdir)/opencode-desktop/resources/app-update.yml

    # Drop the duplicate, non fully qualified desktop entry
    rm -f %(installroot)%(datadir)/applications/opencode-desktop.desktop

    # Fix permissions
    find %(installroot) -type d -exec chmod 755 {} +

    # Launcher symlink
    %install_dir %(installroot)%(bindir)
    ln -srv %(installroot)%(libdir)/opencode-desktop/ai.opencode.desktop %(installroot)%(bindir)/opencode-desktop

    # Point the desktop entry at the launcher
    sed -i "s|/opt/OpenCode/ai.opencode.desktop|opencode-desktop|g" %(installroot)%(datadir)/applications/ai.opencode.desktop.desktop
