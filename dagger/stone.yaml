name        : dagger
version     : "0.21.10"
release     : 9
homepage    : https://dagger.io/
upstreams   :
    - https://github.com/dagger/dagger/archive/refs/tags/v0.21.10.tar.gz : 4177831173a91b8269ca3269d53767fb0b4217d181cdb293612a14ce2f948da0
summary     : A portable devkit for CI/CD pipelines
description : |
    A portable devkit for CI/CD pipelines
license     : Apache-2.0
networking  : true
builddeps   :
    - binary(go)
setup       : |
    go mod vendor
build       : |
    # set Go flags
    export CGO_CFLAGS="${CFLAGS}"
    export CGO_CXXFLAGS="${CXXFLAGS}"

    mkdir build

    # x/net v0.54.0 (pinned by dagger) drops http2.TrailerPrefix under Go 1.27
    # unless the legacy implementation is selected (grpc-go#9206); drop this
    # once dagger upgrades x/net to >= v0.55.0
    go build -v \
        -buildmode=pie \
        -mod=readonly \
        -modcacherw \
        -tags http2legacy \
        -ldflags "-compressdwarf=false \
        -linkmode external \
        -extldflags '${LDFLAGS}' \
        -X github.com/dagger/dagger/engine.Version=v%(version) \
        -X github.com/dagger/dagger/engine.Tag=v%(version)" \
        -o build \
        ./cmd/...

    # Generate completions
    mkdir completions
    ./build/dagger completion bash > completions/dagger
    ./build/dagger completion zsh > completions/_dagger
    ./build/dagger completion fish > completions/dagger.fish
install    : |
    %install_exe build/dagger -t %(installroot)%(bindir)

    %install_file completions/dagger -t %(installroot)%(bashcompletionsdir)
    %install_file completions/_dagger -t %(installroot)%(zshcompletionsdir)
    %install_file completions/dagger.fish -t %(installroot)%(fishcompletionsdir)
