name        : actual-desktop
version     : "26.10.0"
release     : 4
summary     : actual
license     : Distributable
homepage    : https://webcatalog.io/en/desktop
upstreams   :
    - https://github.com/actualbudget/actual/releases/download/v26.10.0/Actual-linux-x86_64.AppImage:
        hash: 21455ba3bfb985e969ed2b5aeebde8a0aeec8836351813c07ea63267e1f47b7b
        unpack: false
        rename: Actual.AppImage
description : |
    actual
rundeps     :
    - libayatana-appindicator
    - libnotify
# Causes krisp noise suppression not to load
debug       : false
strip       : false
setup       : |
    chmod +x %(sourcedir)/Actual.AppImage
    %(sourcedir)/Actual.AppImage --appimage-extract
install     : |
    _actual_dir=%(installroot)/%(libdir)/%(name)
    %install_dir ${_actual_dir}
    cp -r squashfs-root/. ${_actual_dir}

    # Foreign-platform native prebuilds are dead weight and add sonames for
    # architectures moss cannot resolve, so keep only linux-x64
    natives=${_actual_dir}/resources/app.asar.unpacked/node_modules
    rm -rfv ${_actual_dir}/usr/ \
        $natives/argon2/prebuilds/darwin-* \
        $natives/argon2/prebuilds/freebsd-* \
        $natives/argon2/prebuilds/win32-* \
        $natives/argon2/prebuilds/linux-arm* \
        $natives/bcrypt/prebuilds/darwin-* \
        $natives/bcrypt/prebuilds/win32-* \
        $natives/bcrypt/prebuilds/linux-arm*
    rm -f $natives/argon2/prebuilds/linux-x64/argon2.musl.node \
        $natives/bcrypt/prebuilds/linux-x64/bcrypt.musl.node

    %install_dir %(installroot)%(bindir)
    ln -srv ${_actual_dir}/actual %(installroot)%(bindir)/actual

    %install_dir %(installroot)%(datadir)/applications
    cp -r --no-preserve=mode,ownership squashfs-root/usr/share/icons %(installroot)%(datadir)

    ln -srv ${_actual_dir}/actual.desktop %(installroot)%(datadir)/applications/actual.desktop
    sed -i "s|AppRun --no-sandbox|actual|g" ${_actual_dir}/actual.desktop

    # FIX PERM
    find %(installroot) -type d -exec chmod 755 {} +
