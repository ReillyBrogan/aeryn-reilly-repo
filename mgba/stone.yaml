name        : mgba
version     : 0.11.0
release     : 2
upstreams   :
    - git|https://github.com/mgba-emu/mgba.git : 662dada8b79070bde93829a44d583c517fc5ec2d
summary     : mGBA Game Boy Advance Emulator
description : |
    mGBA Game Boy Advance Emulator
license     : MPL-2.0
homepage    : https://mgba.io/
builddeps   :
    - cmake(Qt6Gui)
    - cmake(Qt6LinguistTools)
    - cmake(Qt6Multimedia)
    - pkgconfig(epoxy)
    - pkgconfig(freetype2)
    - pkgconfig(json-c)
    - pkgconfig(libavcodec)
    - pkgconfig(libavfilter)
    - pkgconfig(libavutil)
    - pkgconfig(libedit)
    - pkgconfig(libelf)
    - pkgconfig(libpng)
    - pkgconfig(libswresample)
    - pkgconfig(libswscale)
    - pkgconfig(libzip)
    - pkgconfig(lua)
    - pkgconfig(minizip)
    - pkgconfig(sdl3)
    - pkgconfig(sqlite3)
    - pkgconfig(zlib)
rundeps     :
    - qt6-wayland
setup       : |
    %patch %(pkgdir)/0001-test.patch

    %cmake
build       : |
    %cmake_build
install     : |
    %cmake_install
