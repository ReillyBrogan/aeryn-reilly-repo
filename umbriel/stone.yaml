name        : umbriel
version     : "0~git.33a782dc7"
release     : 5
upstreams   :
    - git|https://github.com/noctalia-dev/umbriel.git : 33a782dc750e78f0ef2d21fd9d3df33229ae06f9
homepage    : https://noctalia.dev/
license     : MIT
summary     : A Wayland compositor designed for daily use
description : |
    A Wayland compositor designed for daily use, with scrolling, dwindle, master, and stacking layouts, per-output workspaces, window rules, blur, shadows, and fluid animations.
builddeps   :
    - binary(wayland-scanner)
    - pkgconfig(cairo)
    - pkgconfig(egl)
    - pkgconfig(gbm)
    - pkgconfig(glesv2)
    - pkgconfig(jemalloc)
    - pkgconfig(lcms2)
    - pkgconfig(libdisplay-info)
    - pkgconfig(libdrm)
    - pkgconfig(libeis-1.0)
    - pkgconfig(libinput)
    - pkgconfig(libsystemd)
    - pkgconfig(libudev)
    - pkgconfig(nlohmann_json)
    - pkgconfig(pangocairo)
    - pkgconfig(pixman-1)
    - pkgconfig(tomlplusplus)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-protocols)
    - pkgconfig(wayland-server)
    - pkgconfig(wlroots-0.20)
    - pkgconfig(xcb)
    - pkgconfig(xcb-ewmh)
    - pkgconfig(xcb-icccm)
    - pkgconfig(xcb-randr)
    - pkgconfig(xcb-shape)
    - pkgconfig(xkbcommon)
rundeps     :
    - xdg-desktop-portal-umbriel
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
